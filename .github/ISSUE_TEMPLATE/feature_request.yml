name: Feature request
description: Suggest a new endpoint, helper, or option
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to build? What does the SDK currently make hard?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How would you want to call it?
      render: ts
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: "`anigamer` is a user-data SDK. Out of scope: video downloading, public catalog data, GUI wrappers. (See CONTRIBUTING.md.)"
      options:
        - label: This is in scope (user-data endpoint or core utility)
          required: true
